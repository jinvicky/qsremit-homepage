<div class="content-page">
    <div class="content">
        <!-- Start Content-->
        <div class="container-fluid">
            <!-- Start Page title -->
            <div th:replace="~{fragments/title}"></div>
            <!-- End page title -->
            <!-- Start Section -->
            <div class="card">
                <div class="card-body">
                    <div id="customNewButton" class="mb-3 flex-wrap justify-content-start">
                        <button id="searchButton" type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#bankDepositCustomerSearch">EC Customer Search</button>
                        <span class="text-danger m-1">Please select EC Customer First.</span>
                    </div>
                    <form
                        method="post"
                        class="form-horizontal"
                        data-parsley-validate="data-parsley-validate"
                        role="form">
                        <fieldset class="mb-3 border-bottom">
                            <div class="mb-2 d-flex align-items-center">
                                <label for="holderName" class="col-md-2 col-form-label text-muted">Holder name</label>
                                <div class="col-md-4">
                                    <input id="holderName" name="holderName" data-parsley-trigger="change" type="text" class="form-control" disabled>
                                </div>
                            </div>
                            <div class="row mb-2">
                                <label for="bankName" class="col-md-2 col-form-label text-muted">Bank Name</label>
                                <div class="col-md-4">
                                    <input disabled id="bankName" data-parsley-trigger="change" type="text" class="form-control" />
                                </div>
                                <label for="accountNo" class="col-md-1 col-form-label text-muted">Account number</label>
                                <div class="col-md-5">
                                    <input id="accountNo" name="accountNo" data-parsley-trigger="change" type="text" class="form-control" disabled>
                                </div>
                            </div>
                            <div class="row mb-2">
                                <label for="depositDate" class="col-md-2 col-form-label">Date<span class="text-danger ms-1">*</span></label>
                                <div class="col-md-4">
                                    <div class="input-group position-relative" id="datepickerIdCardIssueDate">
                                        <input required id="depositDate" name="depositDate" type="text" class="form-control" data-provide="datepicker" data-date-format="yyyy-mm-dd" data-date-autoclose="true" data-date-container="#datepickerIdCardIssueDate">
                                        <span class="input-group-text"><i class="ri-calendar-event-fill"></i></span>
                                    </div>
                                </div>
                                <label for="amount" class="col-md-1 col-form-label">Amount<span class="text-danger ms-1">*</span></label>
                                <div class="col-md-5">
                                    <input required name="amount" id="amount" data-parsley-trigger="change" type="text" class="form-control" placeholder="Input Only Number">
                                </div>
                            </div>
                        </fieldset>
                        <fieldset class="mb-3">
                            <h4 class="header-title py-2">GME</h4>
                            <div class="mb-1 d-flex align-items-center">
                                <label class="col-md-2 col-form-label">Sender type</label>
                                <span>Company</span>
                            </div>
                            <div class="mb-2 d-flex align-items-center">
                                <label for="gmeTypeB2B" class="col-md-2 col-form-label text-muted">Type</label>
                                <div class="form-radio pe-2">
                                    <input
                                        id="gmeTypeB2B"
                                        name="gmeType"
                                        class="form-check-input"
                                        type="radio"
                                        value="B2B" disabled>
                                    <label class="form-check-label">B2B</label>
                                </div>
                                <div class="form-radio pe-2">
                                    <input
                                        id="gmeTypeB2C"
                                        name="gmeType"
                                        class="form-check-input"
                                        type="radio"
                                        value="B2C" checked disabled>
                                    <label class="form-check-label">B2C</label>
                                </div>
                                <div class="form-radio">
                                    <input
                                        id="gmeTypeC2B"
                                        name="gmeType"
                                        class="form-check-input"
                                        type="radio"
                                        value="C2B" disabled>
                                    <label class="form-check-label">C2B</label>
                                </div>
                            </div>
                            <div class="row mb-2">
                                <label for="senderSelect" class="col-md-2 col-form-label">Sender<span class="text-danger ms-1">*</span></label>
                                <div class="col-md-4">
                                    <input id="senderInput" type="hidden">
                                    <select required name="sender" id="senderSelect" parsley-trigger="change"
                                            class="form-select">
                                        <option value="">Select</option>
                                        <option value="N&P" selected>N&P JAPAN CO.,LTD</option>
                                    </select>
                                </div>
                                <label for="senderNameSelect" class="col-md-2 col-form-label">Sender name<span class="text-danger ms-1">*</span></label>
                                <div class="col-md-4">
                                    <select required name="senderName" id="senderNameSelect" parsley-trigger="change"
                                            class="form-select">
                                        <option value="">Select</option>
                                        <option value="N&P" selected>N&P JAPAN CO.,LTD</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mb-2">
                                <label for="reasonSelect" class="col-md-2 col-form-label text-muted">Reason</label>
                                <div class="col-md-4">
                                    <input id="reasonInput" hidden>
                                    <select id="reasonSelect" parsley-trigger="change"
                                            class="form-select" disabled>
                                    </select>
                                </div>
                                <label for="receiver" class="col-md-2 col-form-label text-muted">Receiver</label>
                                <div class="col-md-4">
                                    <input id="receiver" name="receiver" data-parsley-trigger="change" type="text" class="form-control" disabled>
                                </div>
                            </div>
                            <div class="mb-2 d-flex align-items-center">
                                <label class="col-md-2 col-form-label">Receiver type</label>
                                <span>Company</span>
                            </div>
                            <div class="row mb-2">
                                <label for="companyName" class="col-md-2 col-form-label text-muted">Company name</label>
                                <div class="col-md-4">
                                    <input id="companyName" name="companyName" data-parsley-trigger="change" type="text" class="form-control" disabled>
                                </div>
                                <label for="companyAddress" class="col-md-2 col-form-label text-muted">Address</label>
                                <div class="col-md-4">
                                    <input id="companyAddress" name="companyAddress" data-parsley-trigger="change" type="text" class="form-control" disabled>
                                </div>
                            </div>
                            <div class="row mb-2">
                                <label for="settlement" class="col-md-2 col-form-label">Settlement<span class="text-danger ms-1">*</span></label>
                                <div class="col-md-4">
                                    <input required name="settlement" id="settlement" data-parsley-trigger="change" type="text" class="form-control" placeholder="Input Only Number">
                                </div>
                                <label for="settlementAmount" class="col-md-2 col-form-label">Settlement amount<span class="text-danger ms-1">*</span></label>
                                <div class="col-md-4">
                                    <input required name="settlementAmount" id="settlementAmount" data-parsley-trigger="change" type="text" class="form-control" placeholder="Input Only Number">
                                </div>
                            </div>
                            <div class="row mb-2">
                                <label for="payout" class="col-md-2 col-form-label">Payout<span class="text-danger ms-1">*</span></label>
                                <div class="col-md-4">
                                    <input required name="payout" id="payout" data-parsley-trigger="change" type="text" class="form-control" placeholder="Input Only Number">
                                </div>
                                <label for="payoutAmount" class="col-md-2 col-form-label">Payout amount<span class="text-danger ms-1">*</span></label>
                                <div class="col-md-4">
                                    <input required name="payoutAmount" id="payoutAmount" data-parsley-trigger="change" type="text" class="form-control" placeholder="Input Only Number">
                                </div>
                            </div>
                        </fieldset>
                        <div class="text-center">
                            <a
                                href="/pgManagement/bankDepositManagement"
                                type="button"
                                class="btn btn-outline-primary width-xl">Cancel</a>
                            <button type="submit" class="btn btn-primary width-xl">Save</button>
                        </div>
                    </form>
                </div>
            </div>
            <!-- End Section-->
        </div>
        <!-- End Container -->
    </div>
    <!-- End Content -->
    <!-- Modal -->
    <div th:replace="~{contents/pgManagement/modalBankDepositCustomerSearch.html}"></div>
    <!-- Footer Start -->
    <div th:replace="~{fragments/footer}"></div>
    <!-- End Footer -->
</div>
