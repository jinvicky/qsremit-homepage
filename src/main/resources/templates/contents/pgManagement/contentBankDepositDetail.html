<div class="content-page">
    <div class="content">
        <!-- Start Content-->
        <div class="container-fluid">
            <!-- Start Page title -->
            <div th:replace="~{fragments/title}"></div>
            <!-- End page title -->
            <!-- Start Section -->
            <div class="card">
                <div class="card-body">
                    <div id="customNewButton" class="mb-3 flex-wrap justify-content-start">
                        <button id="searchButton" type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#bankDepositCustomerSearch"
                                style="display: none; cursor: not-allowed;" disabled>EC Customer Search</button>
                        <span id="searchInfo" class="text-danger m-1" style="display: none;">Please select EC Customer.</span>
                    </div>
                    <form
                            method="post"
                            class="form-horizontal"
                            data-parsley-validate="data-parsley-validate"
                            role="form">
                        <fieldset class="mb-2 border-bottom">
                            <div class="mb-3 d-flex align-items-center">
                                <label class="col-md-2 col-form-label">Status</label>
                                <div class="col-md-6">
                                    <span class="status text-md-end">status</span>
                                </div>
                            </div>
                            <div class="mb-2 d-flex align-items-center">
                                <label class="col-md-2 col-form-label text-muted">Holder name</label>
                                <div class="col-md-4">
                                    <input id="holderName" data-parsley-trigger="change" type="text" class="form-control" disabled>
                                </div>
                            </div>
                            <div class="row mb-2">
                                <label class="col-md-2 col-form-label text-muted">Bank Name</label>
                                <div class="col-md-4">
                                    <input id="bankName" name="bankName" data-parsley-trigger="change" type="text" class="form-control" disabled>
                                </div>
                                <label class="col-md-1 col-form-label text-muted">Account number</label>
                                <div class="col-md-5">
                                    <input id="accountNo" data-parsley-trigger="change" type="text" class="form-control" disabled>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label class="col-md-2 col-form-label">Date<span class="text-danger ms-1">*</span></label>
                                <div class="col-md-4">
                                    <div class="input-group position-relative" id="datepickerIdCardIssueDate">
                                        <input id="depositDate" required type="text" class="form-control" data-provide="datepicker" data-date-format="yyyy-mm-dd" data-date-autoclose="true" data-date-container="#datepickerIdCardIssueDate">
                                        <span class="input-group-text"><i class="ri-calendar-event-fill"></i></span>
                                    </div>
                                </div>
                                <label class="col-md-1 col-form-label">Amount<span class="text-danger ms-1">*</span></label>
                                <div class="col-md-5">
                                    <input id="amount" data-parsley-trigger="change" type="text" class="form-control" placeholder="Input Only Number">
                                </div>
                            </div>
                        </fieldset>
                        <fieldset class="mb-2">
                            <h4 class="header-title py-2">GME</h4>
                            <div class="mb-1 d-flex align-items-center">
                                <label class="col-md-2 col-form-label">Sender type</label>
                                <span>Company</span>
                            </div>
                            <div class="mb-2 d-flex align-items-center">
                                <label class="col-md-2 col-form-label text-muted">Type</label>
                                <div class="form-radio pe-2">
                                    <input
                                            name="gmeType"
                                            class="form-check-input"
                                            type="radio"
                                            value="B2B" disabled>
                                    <label class="form-check-label">B2B</label>
                                </div>
                                <div class="form-radio pe-2">
                                    <input
                                            name="gmeType"
                                            class="form-check-input"
                                            type="radio"
                                            value="B2C" checked disabled>
                                    <label class="form-check-label">B2C</label>
                                </div>
                                <div class="form-radio">
                                    <input
                                            name="gmeType"
                                            class="form-check-input"
                                            type="radio"
                                            value="C2B" disabled>
                                    <label class="form-check-label">C2B</label>
                                </div>
                            </div>
                            <div class="row mb-2">
                                <label class="col-md-2 col-form-label">Sender<span class="text-danger ms-1">*</span></label>
                                <div class="col-md-4">
                                    <input type="hidden">
                                    <select id="senderSelect" parsley-trigger="change"
                                            class="form-select">
                                        <option value="">Select</option>
                                        <option value="N&P">N&P JAPAN CO.,LTD</option>
                                    </select>
                                </div>
                                <label class="col-md-2 col-form-label">Sender name<span class="text-danger ms-1">*</span></label>
                                <div class="col-md-4">
                                    <input type="hidden">
                                    <select id="senderNameSelect" parsley-trigger="change"
                                            class="form-select">
                                        <option value="">Select</option>
                                        <option value="N&P">N&P JAPAN CO.,LTD</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mb-2">
                                <label class="col-md-2 col-form-label text-muted">Reason</label>
                                <div class="col-md-4">
                                    <input id="reasonInput" hidden>
                                    <select id="reasonSelect" parsley-trigger="change" class="form-select" disabled>
                                    </select>
                                </div>
                                <label class="col-md-2 col-form-label text-muted">Receiver</label>
                                <div class="col-md-4">
                                    <input id="receiver" data-parsley-trigger="change" type="text" class="form-control" disabled>
                                </div>
                            </div>
                            <div class="mb-2 d-flex align-items-center">
                                <label class="col-md-2 col-form-label">Receiver type</label>
                                <span>Company</span>
                            </div>
                            <div class="row mb-2">
                                <label class="col-md-2 col-form-label text-muted">Company name</label>
                                <div class="col-md-4">
                                    <input id="companyName" data-parsley-trigger="change" type="text" class="form-control" disabled>
                                </div>
                                <label class="col-md-2 col-form-label text-muted">Address</label>
                                <div class="col-md-4">
                                    <input id="address" data-parsley-trigger="change" type="text" class="form-control" disabled>
                                </div>
                            </div>
                            <div class="row mb-2">
                                <label class="col-md-2 col-form-label">Settlement<span class="text-danger ms-1">*</span></label>
                                <div class="col-md-4">
                                    <input id="settlement" data-parsley-trigger="change" type="text" class="form-control" placeholder="Input Only Number">
                                </div>
                                <label class="col-md-2 col-form-label">Settlement amount<span class="text-danger ms-1">*</span></label>
                                <div class="col-md-4">
                                    <input id="settlementAmount" data-parsley-trigger="change" type="text" class="form-control" placeholder="Input Only Number">
                                </div>
                            </div>
                            <div class="row mb-2">
                                <label class="col-md-2 col-form-label">Payout<span class="text-danger ms-1">*</span></label>
                                <div class="col-md-4">
                                    <input id="payout" data-parsley-trigger="change" type="text" class="form-control" placeholder="Input Only Number">
                                </div>
                                <label class="col-md-2 col-form-label">Payout amount<span class="text-danger ms-1">*</span></label>
                                <div class="col-md-4">
                                    <input id="payoutAmount" data-parsley-trigger="change" type="text" class="form-control" placeholder="Input Only Number">
                                </div>
                            </div>
                        </fieldset>
                        <fieldset class="memo mb-3 border-top">
                            <div class="mt-3 mb-2 d-flex align-items-center">
                                <label class="col-md-2 col-form-label">Memo</label>
                                <div class="col-md-4">
                                    <input id="memo" data-parsley-trigger="change" type="text" class="form-control">
                                </div>
                            </div>
                        </fieldset>
                        <div class="text-center">
                            <a
                                    href="/pgManagement/bankDepositManagement"
                                    type="button"
                                    class="btn btn-outline-primary width-xl">Cancel</a>
                            <button id="saveButton" type="submit" class="btn btn-primary width-xl"
                                    style="display: none; cursor: not-allowed;" disabled>Save</button>
                        </div>
                    </form>
                </div>
            </div>
            <!-- End Section-->
        </div>
        <!-- End Container -->
    </div>
    <!-- End Content -->
    <!-- Modal -->
    <div th:replace="~{contents/pgManagement/modalBankDepositCustomerSearch.html}"></div>
    <!-- Footer Start -->
    <div th:replace="~{fragments/footer}"></div>
    <!-- End Footer -->
</div>
