<div class="content-page">
    <div class="content">
        <!-- Start Content-->
        <div class="container-fluid">
            <!-- Start Page title -->
            <div th:replace="~{fragments/title}"></div>
            <!-- End page title -->
            <!-- Start Filter -->
            <div class="card">
                <div class="card-body">
                    <form>
                            <div class="d-flex flex-wrap align-items-center">
                                <label for="searchCustomerType" class="col-md-4 col-form-label mb-1">Customer Type</label>
                                <div id="searchCustomerType" class="d-flex flex-wrap">
                                    <div class="form-check pe-4 d-flex align-content-center" th:if="${type.active}" th:each="type: ${customerTypes}">
                                        <input class="form-check-input searchCustomerType" type="checkbox"
                                               th:id="${type.customerType}"
                                               th:value="${type.customerType}">
                                        <label class="form-check-label"
                                               th:for="${type.customerType + 'check'}"
                                               th:text="${!type.isNullable ? type.customerType : type.customerType + ' (Empty Type)'}">
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="row d-flex flex-wrap align-items-start mt-3">
                                <label for="columnSelect" class="col-md-1 mt-sm-1">Search By</label>
                                <div class="d-flex col-md-5">
                                    <select class="form-select" id="columnSelect">
                                        <option value="depositName">Deposit Name</option>
                                        <option value="depositAmount">Amount</option>
                                        <option value="customerNum">Customer Number</option>
                                        <option value="customerName">Customer Name</option>
                                        <option value="customerGender">Gender</option>
                                        <option value="customerAddress">Address</option>
                                    </select>
                                    <input class="form-control" type="text" name="searchText" id="searchText">
                                    <select class="form-select" id="genderSelect">
                                        <option value="">All</option>
                                        <option value="MALE">MALE</option>
                                        <option value="FEMALE">FEMALE</option>
                                    </select>
                                </div>
                                <div class="col-md-6 ps-2">
                                    <div class="d-flex align-items-center">
                                        <label for="startDate" class="col-md-1">Date</label>
                                        <span class="pe-sm-2">From</span>
                                        <div class="input-group position-relative" id="datepickerStartDate">
                                            <input id="startDate" type="text" class="form-control" data-provide="datepicker"
                                                   data-date-format="yyyy-mm-dd" data-date-autoclose="true"
                                                   data-date-container="#datepickerStartDate"
                                                   pattern="\d{4}-\d{2}-\d{2}"
                                                   maxlength="10">
                                            <span class="input-group-text"><i class="ri-calendar-event-fill"></i></span>
                                        </div> <!-- input-group -->
                                        <span class="px-sm-2">To</span>
                                        <div class="input-group position-relative" id="datepickerEndDate">
                                            <input id="endDate" type="text" class="form-control" data-provide="datepicker"
                                                   data-date-format="yyyy-mm-dd" data-date-autoclose="true"
                                                   data-date-container="#datepickerEndDate"
                                                   pattern="\d{4}-\d{2}-\d{2}"
                                                   maxlength="10">
                                            <span class="input-group-text"><i class="ri-calendar-event-fill"></i></span>
                                        </div> <!-- input-group -->
                                    </div>
                                    <ul class="date-validate-message pt-1 font-13">
                                        <li>Start date cannot be later than the end date. End date cannot be earlier than the start date.</li>
                                    </ul>
                                </div>
                            </div>
                        <div class="text-center mt-sm-1">
                            <button id="searchBtn" type="button" class="btn btn-dark width-xl">Search</button>
                        </div>
                    </form>
                </div>
            </div>
            <!-- End Filter -->
            <!-- Start Table Section-->
            <div class="card">
                <div class="card-body">
                    <span id="summary" class="h4 mb-lg-1">Summary</span>
                    <table id="customerTotalTable" class="display table table-hover table-centered m-6">
                        <thead>
                        <tr>
                            <th>Customer Type</th>
                            <th>EA</th>
                            <th class="text-end">Total Amount</th>
                        </tr>
                        </thead>
                        <tbody id="customerTypeSummary">
                            <!-- 동적으로 생성될 고객 유형 행들 -->
                        </tbody>
                        <tbody>
                        <tr id="data-total">
                            <td><b>Total</b></td>
                            <td><b></b></td>
                            <td class="text-end"><b></b></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <!-- End Table Section-->
            <!-- Start Table Section-->
            <div class="card">
                <div class="card-body">
                    <div class="row d-flex flex-wrap align-items-start">
                        <div class="col-md-7 bank-color-list-wrapper">
                            <div class="d-flex justify-content-between bank-color-list"></div>
                        </div>
                        <div class="col-md-5">
                            <div class="mb-2">
                                <div class="d-flex justify-content-end">To upload Address Excel,</div>
                                <div class="d-flex justify-content-end">Please download and use the provided <b> "Excel Form"</b></div>
                            </div>
                            <div class="d-flex justify-content-end">
                                <button id="uploadExcelButton" class="btn btn-secondary width-xl">Upload Address Excel</button>
                                <button id="downloadFormButton" class="btn btn-soft-secondary width-xl ms-1">Download Excel Form</button>
                            </div>
                            <div class="d-flex justify-content-end">
                                <div id="custom-dt-buttons"></div>
                            </div>
                            <div class="flex justify-content-end">
                            </div>
                        </div>
                    </div>
                    <input hidden="hidden" id="tablePageInput" type="number" value="">
                    <div class="table-responsive">
                        <table id="accountDepositManagementTable" class="display table table-bordered table-hover table-centered m-0">
                            <thead>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
            <!-- End Table Section-->
        </div>
        <!-- End Content -->
        <!-- Modal -->
        <div th:replace="~{contents/pgManagement/modalAccountDepositCustomerType.html}"></div>
        <div th:replace="~{contents/pgManagement/modalAccountDepositAddressChange.html}"></div>
    </div>
    <!-- Footer Start -->
    <div th:replace="~{fragments/footer}"></div>
    <!-- End Footer -->
</div>
