<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/terms-layout}">
<head>
    <title>QSRemit - Notice</title>
</head>
<body>
<div layout:fragment="terms-content">
    <div class="relative py-16 bg-white overflow-hidden">
        <div class="hidden lg:block lg:absolute lg:inset-y-0 lg:h-full lg:w-full">
            <div class="relative h-full text-lg max-w-prose mx-auto" aria-hidden="true">
                <svg class="absolute top-12 left-full transform translate-x-32" width="404" height="384" fill="none"
                     viewBox="0 0 404 384">
                    <defs>
                        <pattern id="74b3fd99-0a6f-4271-bef2-e80eeafdf357" x="0" y="0" width="20" height="20"
                                 patternUnits="userSpaceOnUse">
                            <rect x="0" y="0" width="4" height="4" class="text-gray-200" fill="currentColor"></rect>
                        </pattern>
                    </defs>
                    <rect width="404" height="384" fill="url(#74b3fd99-0a6f-4271-bef2-e80eeafdf357)"></rect>
                </svg>
                <svg class="absolute top-1/2 right-full transform -translate-y-1/2 -translate-x-32" width="404"
                     height="384" fill="none" viewBox="0 0 404 384">
                    <defs>
                        <pattern id="f210dbf6-a58d-4871-961e-36d5016a0f49" x="0" y="0" width="20" height="20"
                                 patternUnits="userSpaceOnUse">
                            <rect x="0" y="0" width="4" height="4" class="text-gray-200" fill="currentColor"></rect>
                        </pattern>
                    </defs>
                    <rect width="404" height="384" fill="url(#f210dbf6-a58d-4871-961e-36d5016a0f49)"></rect>
                </svg>
                <svg class="absolute bottom-12 left-full transform translate-x-32" width="404" height="384" fill="none"
                     viewBox="0 0 404 384">
                    <defs>
                        <pattern id="d3eb07ae-5182-43e6-857d-35c643af9034" x="0" y="0" width="20" height="20"
                                 patternUnits="userSpaceOnUse">
                            <rect x="0" y="0" width="4" height="4" class="text-gray-200" fill="currentColor"></rect>
                        </pattern>
                    </defs>
                    <rect width="404" height="384" fill="url(#d3eb07ae-5182-43e6-857d-35c643af9034)"></rect>
                </svg>
            </div>
        </div>
        <div class="relative px-4 sm:px-6 lg:px-8">
            <div class="text-lg max-w-prose mx-auto">
                <h1 class="text-center"><span
                        class="mt-2 text-3xl leading-8 font-semibold tracking-tight text-primary sm:text-4xl">Notice</span>
                </h1>
                <div class="bg-white shadow overflow-hidden w-full md:w-2/3 mx-0 md:mx-auto sm:rounded-lg mt-8 sm:mt-12 spacey-y-4">
                    <div class="p-4 space-y-3">
                        <h3><a class="text-2xl font-medium text-primary" href="/en/notice/2023-08-28-updated">Website
                            upgraded</a></h3>
                        <div class="text-sm text-gray-500">
                            Posted on:
                            <!-- -->2023-08-24<!-- -->
                            <!-- -->10:00:00.000Z
                        </div>
                        <div class="text-md text-gray-600">Website upgraded with basic version upgrades.</div>
                    </div>
                </div>
                <div class="mt-16">
                    <div class="max-w-7xl mx-auto py-12 lg:flex lg:items-center lg:justify-between">
                        <h2 class="text-2xl tracking-tight text-primary md:text-3xl"><span class="block">가까운 지점을 찾고 계십니까?</span>
                        </h2>
                        <div class="mt-8 flex lg:mt-0 lg:flex-shrink-0">
                            <div class="inline-flex rounded-md shadow">
                                <a class="inline-flex items-center justify-center px-5 py-3 border border-transparent text-base font-medium rounded-md text-white bg-primary hover:bg-yellow-600"
                                   href="/kr/Branches">
                                    지점 찾기
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="${'fragments/kr/terms-support'}"></div>
</div>

</body>
</html>
