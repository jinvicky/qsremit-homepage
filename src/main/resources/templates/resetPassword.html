<!DOCTYPE html>
<html lang="en" data-topbar-color="brand">
    <head>
        <meta charset="utf-8" />
        <title>Log In | N&P JAPAN</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="A fully featured admin theme which can be used to build CRM, CMS, etc." name="description" />
        <meta content="Coderthemes" name="author" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <!-- App favicon -->
        <link rel="shortcut icon" href="nnp/images/favicon.ico">

		<!-- App css -->
		<link href="/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
		<link href="/css/app.min.css" rel="stylesheet" type="text/css" id="app-stylesheet" />
        <link href="/nnp/css/nnpCustom.css" rel="stylesheet" type="text/css" />

		<!-- icons -->
		<link href="/css/icons.min.css" rel="stylesheet" type="text/css" />

		<!-- Theme Config Js -->
		<script src="/js/config.js"></script>
    </head>

    <body class="loading">

        <div class="account-pages mt-5 mb-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-6 col-xl-4">
                        <div class="card">

                            <div class="card-body p-4">

                                <div class="text-center w-75 m-auto">
                                    <div class="auth-logo">
                                        <a href="index.html" class="logo logo-dark text-center">
                                            <span class="logo-lg">
                                                <img src="nnp/images/qsremit-logo.png" alt="" height="22">
                                            </span>
                                        </a>
                                    </div>
                                    <p class="text-muted mb-4 mt-3">Enter the ID and email address you registered with. We’ll send you instructions to reset your password.</p>
                                </div>

                                <form id="resetPasswordForm" method="post" action="/reset" class="form-horizontal" role="form">
                                    <div class="mb-3">
                                        <label for="userId" class="form-label">ID</label>
                                        <input class="form-control" type="text" required
                                               id="userId" name="userId" placeholder="Enter your id">
                                    </div>
                                    <div class="mb-3">
                                        <label for="email" class="form-label">Email</label>
                                        <input class="form-control" type="email" required
                                           id="email" name="email" placeholder="Enter your email">
                                    </div>
                                    <div class="d-grid text-center">
                                        <button class="btn btn-primary" type="submit">Password Reset</button>
                                    </div>
                                </form>

                            </div> <!-- end card-body -->
                        </div>
                        <!-- end card -->

                        <div class="row mt-3">
                            <div class="col-12 text-center">
                                <p class="text-muted">back to <a href="/login" class="text-primary fw-medium ms-1">Log in</a></p>
                            </div> <!-- end col -->
                        </div>
                        <!-- end row -->

                    </div> <!-- end col -->
                </div>
                <!-- end row -->
            </div>
            <!-- end container -->
        </div>
        <!-- end page -->
        <div id="loadingSpinner" style="display: none;">
            <div class="d-flex justify-content-center align-items-center position-fixed top-0 start-0 w-100 h-100 bg-white bg-opacity-50" style="z-index: 1050;">
                <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>

        <footer class="footer footer-alt">
            <script>document.write(new Date().getFullYear())</script> &copy; N&P JAPAN
        </footer>

        <!-- Vendor js -->
        <script src="/js/vendor.min.js"></script>

        <!-- App js -->
        <script src="/js/app.min.js"></script>
        <script src="/nnp/js/resetPassword.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/js-cookie/3.0.5/js.cookie.min.js"></script>
    </body>
</html>
